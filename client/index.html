<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d0c" />
    <link rel="icon" href="/inchat-logo.png" />
    <meta name="description" content="InChat — a modern, Indian-inspired messaging dashboard." />
    <title>InChat — Conversations, your way</title>
    <script>
      // Runs before the stylesheet paints. Without it the first frame is always
      // the default theme and the app visibly flashes when React settles the
      // stored choice a tick later. The browser chrome colour is written from the
      // same decision, because a media-query theme-colour would follow the OS
      // while the page follows the user's own toggle.
      (function () {
        var dark;
        try {
          var stored = localStorage.getItem('inchat-theme');
          dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (err) {
          dark = true;
        }
        window.__inchatSetTheme = function (isDark) {
          document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isDark ? '#0b0d0c' : '#f4f7f5');
        };
        window.__inchatSetTheme(dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
