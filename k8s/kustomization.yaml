apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: groupchat

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - redis.yaml
  - storage.yaml
  - app.yaml
  - scaling.yaml
  - networking.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: realtime-chat
    includeSelectors: false

images:
  # CI pins the digest: kustomize edit set image ...
  - name: ghcr.io/your-org/groupchat-realtime
    newTag: latest
