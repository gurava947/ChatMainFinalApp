apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: groupchat-app
  namespace: groupchat
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Long-lived sockets must not be killed by the default 60s proxy timeout.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "52m"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    # Per-client connection cap at the edge, on top of the app's own limiter.
    nginx.ingress.kubernetes.io/limit-rpm: "300"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [chat.example.com]
      secretName: groupchat-tls
  rules:
    - host: chat.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: groupchat-app
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: groupchat-app
  namespace: groupchat
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: groupchat-app
  policyTypes: [Ingress]
  ingress:
    # Only the ingress controller and same-namespace probes may reach pods.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: groupchat-redis
  namespace: groupchat
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: groupchat-redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: groupchat-app
      ports:
        - protocol: TCP
          port: 6379
