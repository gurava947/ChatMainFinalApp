apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: groupchat-redis-data
  namespace: groupchat
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: groupchat-redis
  namespace: groupchat
  labels:
    app.kubernetes.io/name: groupchat-redis
    app.kubernetes.io/component: cache
spec:
  # A single Redis holds the shared room state; scaling this needs a cluster
  # or managed Redis, not another replica reading a different PVC.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: groupchat-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: groupchat-redis
        app.kubernetes.io/component: cache
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: redis:7.4-alpine
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - 384mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: groupchat-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: groupchat-redis
  namespace: groupchat
  labels:
    app.kubernetes.io/name: groupchat-redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: groupchat-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
