apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: groupchat-app
  namespace: groupchat
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: groupchat-app
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    # Socket.io clients hold connections for a long time, so adding capacity is
    # urgent but removing it must be slow enough to let sockets drain.
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 180
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: groupchat-app
  namespace: groupchat
spec:
  # Never let a node drain take the room state down to zero live replicas.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: groupchat-app
