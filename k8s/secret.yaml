# Demo manifest with placeholder values. In a real cluster this file is NOT
# committed: create it with `kubectl create secret generic groupchat-secret
# --from-literal=REDIS_URL=...` or render it through Sealed Secrets / External
# Secrets in the CD step.
apiVersion: v1
kind: Secret
metadata:
  name: groupchat-secret
  namespace: groupchat
type: Opaque
stringData:
  # Redis has no auth in this sample; managed Redis usually needs rediss://
  # with a password and CA bundle here instead.
  REDIS_URL: "redis://groupchat-redis:6379/0"
