# Connection upgrade map: keep `Connection: close` for plain requests.
map $http_upgrade $connection_upgrade {
  default  upgrade;
  ''       close;
}

upstream groupchat_app {
  # ip_hash keeps polling-based reconnects on the same replica; once a socket
  # is on WebSocket the Redis adapter makes any replica equivalent.
  ip_hash;
  server app:3000 max_fails=3 fail_timeout=15s;
  keepalive 64;
}

server {
  listen 80;
  listen [::]:80;
  server_name _;

  location = /nginx-health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location /.well-known/acme-challenge/ {
    allow all;
    root /var/www/certbot;
  }

  location / {
    return 308 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name _;

  # Replace with Let's Encrypt/certbot volumes for real deployments.
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /nginx-health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Socket.io: upgrade headers + long read timeout, no buffering.
  location /socket.io/ {
    limit_req   zone=ws burst=20 nodelay;
    limit_conn  perip 60;

    proxy_pass http://groupchat_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /api/ {
    limit_req  zone=api burst=40 nodelay;
    access_log off;

    proxy_pass http://groupchat_app;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
  }

  # Attachment upload: multipart bodies are as large as MEDIA_MAX_BYTES, so this
  # location lifts the 32k global cap and uses its own (slower) request budget.
  location = /api/media {
    limit_req  zone=upload burst=6 nodelay;
    client_max_body_size 52m;

    proxy_pass http://groupchat_app;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Attachment download: byte-range streaming, so no buffering and no rewrite.
  # The app sets Cache-Control/Content-Disposition; nothing is hidden here.
  location /media/ {
    limit_req  zone=media burst=60 nodelay;
    access_log off;

    proxy_pass http://groupchat_app;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_buffering off;
  }

  location = /healthz {
    proxy_pass http://groupchat_app;
    access_log off;
  }

  location = /readyz {
    proxy_pass http://groupchat_app;
    access_log off;
  }

  # Static assets: nginx serves them straight from the app upstream with a
  # long cache lifetime, HTML stays short-lived (see app's Cache-Control).
  location ~* \.(css|js|svg|png|jpg|webp|woff2?)$ {
    proxy_pass http://groupchat_app;
    proxy_set_header Host $host;
    proxy_buffering on;
    # The app sends a short revalidation window; long-lived assets get the CDN
    # style lifetime decided here instead.
    proxy_hide_header Cache-Control;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    access_log off;
  }

  location / {
    proxy_pass http://groupchat_app;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
  }
}
