user  nginx;
worker_processes  auto;
worker_rlimit_nofile  65535;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
  use epoll;
  worker_connections  4096;
  multi_accept        on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Keep secrets and request lines out of logs; the chat body never passes here.
  log_format  main  '$remote_addr - [$time_local] "$request" $status '
                    '$body_bytes_sent rt=$request_time "$http_user_agent"';
  access_log  /var/log/nginx/access.log  main buffer=32k flush=5s;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  server_tokens   off;
  keepalive_timeout  75s;
  keepalive_requests 1000;

  # WebSocket upgrades bypass buffering; these limits stop slow-client memory
  # pressure from reaching the Node replicas.
  proxy_read_timeout     120s;
  proxy_send_timeout     120s;
  send_timeout           60s;
  client_max_body_size   32k;

  # One zone for the JSON API, one for the socket handshake burst.
  limit_req_zone  $binary_remote_addr zone=api:10m     rate=20r/s;
  limit_req_zone  $binary_remote_addr zone=ws:10m      rate=5r/s;
  limit_req_zone  $binary_remote_addr zone=upload:10m  rate=2r/s;
  limit_req_zone  $binary_remote_addr zone=media:10m   rate=30r/s;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_comp_level   5;
  gzip_types        text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/conf.d/*.conf;
}
